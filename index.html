<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PennyDrop — Expense Tracker</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">
        <header>
            <h1>PennyDrop</h1>
            <p>Track your smarter spending</p>
        </header>

        <section class="dashboard">
            <div class="balance-card">
                <h3>Total Spent</h3>
                <h2 id="total-amount">$0.00</h2>
            </div>
        </section>

        <section class="form-section">
            <h3>Add New Expense</h3>
            <form id="expense-form">
                <div class="form-group">
                    <label for="desc">Description</label>
                    <input type="text" id="desc" placeholder="e.g., Groceries" required>
                </div>
                <div class="form-group">
                    <label for="amount">Amount ($)</label>
                    <input type="number" id="amount" step="0.01" placeholder="0.00" required>
                </div>
                <div class="form-group">
                    <label for="category">Category</label>
                    <select id="category">
                        <option value="Food">Food</option>
                        <option value="Rent">Rent</option>
                        <option value="Utilities">Utilities</option>
                        <option value="Entertainment">Entertainment</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <button type="submit" class="btn-submit">Add Expense</button>
            </form>
        </section>

        <section class="history-section">
            <h3>Expense History</h3>
            <ul id="expense-list">
                </ul>
        </section>

        <footer>
            <p>Made with ❤️ by <a href="https://github.com/Iamanisha-coder" target="_blank" rel="noopener noreferrer">Anisha Tripathi</a></p>
            <p>&copy; 2026 PennyDrop</p>
        </footer>
    </div>

    <script src="js/storage.js"></script>
    <script src="js/tracker.js"></script>
    <script src="js/app.js"></script>
</body>
</html>
